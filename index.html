  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const links = document.querySelectorAll('.device-redirect');
      links.forEach(link => {
        link.addEventListener('click', function () {
          const baseHref = this.getAttribute('data-base-href');
          redirectBasedOnDevice(baseHref);
        });
      });
    });

    function redirectBasedOnDevice(baseHref) {
      const userAgent = navigator.userAgent.toLowerCase();
      const isMobile = /mobile|android|iphone|ipad|ipod/i.test(userAgent);
      const extension = isMobile ? '_m.html' : '.html';

      window.location.href = baseHref + extension;
    }
  </script>

  <script>
    // 创建随机圆形背景
    function createCircles() {
      const colors = [
        'rgba(67, 97, 238, 0.1)',   // primary 淡色
        'rgba(255, 107, 107, 0.1)',  // secondary 淡色
        'rgba(255, 209, 102, 0.1)',  // accent 淡色
        'rgba(43, 45, 66, 0.1)',     // dark 淡色
        'rgba(248, 249, 250, 0.3)'   // light 淡色
      ];
      const circlesContainer = document.getElementById('circles');
      const numCircles = window.innerWidth < 640 ? 8 : 12; // 小屏幕减少圆形数量

      // 清空现有圆形
      circlesContainer.innerHTML = '';

      for (let i = 0; i < numCircles; i++) {
        const circle = document.createElement('div');
        circle.classList.add('circle');

        // 根据屏幕尺寸调整圆形大小
        const baseSize = window.innerWidth < 640 ? 20 : 40;
        const size = Math.random() * baseSize + baseSize; // 随机大小

        // 确保圆形不会超出视口
        const x = Math.random() * (window.innerWidth - size);
        const y = Math.random() * (window.innerHeight - size);
        const color = colors[Math.floor(Math.random() * colors.length)];

        circle.style.width = `${size}px`;
        circle.style.height = `${size}px`;
        circle.style.left = `${x}px`;
        circle.style.top = `${y}px`;
        circle.style.backgroundColor = color;
        circle.style.opacity = Math.random() * 0.3 + 0.1; // 透明度 0.1-0.4

        circlesContainer.appendChild(circle);
      }
    }

    // 随机旅行相关图标列表
    const travelIcons = [
      'fa-plane', 'fa-ship', 'fa-car', 'fa-bus', 'fa-train',
      'fa-camera', 'fa-map-o', 'fa-compass', 'fa-globe', 'fa-suitcase',
      'fa-bed', 'fa-utensils', 'fa-coffee', 'fa-umbrella', 'fa-sun-o',
      'fa-moon-o', 'fa-tree', 'fa-mountain', 'fa-hiking', 'fa-campground',
      'fa-life-ring', 'fa-anchor', 'fa-bicycle', 'fa-snowflake-o', 'fa-map-marker'
    ];

    // 为每个卡片分配随机图标
    document.addEventListener('DOMContentLoaded', function () {
      const cards = document.querySelectorAll('.grid a');

      cards.forEach(card => {
        // 跳过前4个已经有图标的卡片
        if (Array.from(cards).indexOf(card) < 4) return;

        const randomIcon = travelIcons[Math.floor(Math.random() * travelIcons.length)];
        const iconContainer = card.querySelector('.rounded-full');
        const iconColorClass = getRandomColorClass();

        // 移除旧图标
        iconContainer.innerHTML = '';

        // 创建新图标元素
        const icon = document.createElement('i');
        icon.className = `fa ${randomIcon} ${iconColorClass} text-lg`;

        // 添加新图标
        iconContainer.appendChild(icon);
      });
    });

    // 获取随机颜色类
    function getRandomColorClass() {
      const colorClasses = [
        'text-primary', 'text-secondary', 'text-accent',
        'text-green-600', 'text-purple-600', 'text-indigo-600',
        'text-teal-600', 'text-orange-600'
      ];
      return colorClasses[Math.floor(Math.random() * colorClasses.length)];
    }

    // 初始创建圆形
    createCircles();

    // 窗口大小变化时重新创建圆形
    window.addEventListener('resize', createCircles);
  </script>
